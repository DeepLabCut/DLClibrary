name: build and test release

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag or branch to build"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build-and-test-wheel:
    name: wheel install py3.12
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          # Needed for setuptools-scm
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine setuptools-scm

      - name: Show SCM-derived version
        run: python -m setuptools_scm

      - name: Build and check metadata
        run: |
          python -m build
          python -m twine check --strict dist/*
          ls dist

      - name: Install the wheel
        run: python -m pip install "$(ls dist/*.whl)" "pytest>=8"

      - name: Test the wheel outside the source tree
        run: |
          cp -r tests "$RUNNER_TEMP/wheeltest"
          cd "$RUNNER_TEMP"
          pytest wheeltest

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
