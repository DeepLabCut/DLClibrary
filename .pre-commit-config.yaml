default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        stages: [pre-commit, manual]
      - id: check-yaml
        stages: [pre-commit, manual]
      - id: check-toml
        stages: [pre-commit, manual]
      - id: check-merge-conflict
        stages: [pre-commit, manual]
      - id: name-tests-test
        args: [--pytest-test-first]
        stages: [pre-commit, manual]
      - id: check-json
        stages: [pre-commit, manual]
      # In CI a fixer fails by modifying the file; --show-diff-on-failure prints the change
      - id: end-of-file-fixer
        stages: [pre-commit, manual]
      - id: trailing-whitespace
        stages: [pre-commit, manual]

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.19.0
    hooks:
      - id: pyproject-fmt
        stages: [pre-commit, manual]

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject
        stages: [pre-commit, manual]

  - repo: local
    hooks:
      # Checks every file NOTICE.yml covers, not only the changed ones; add headers with tools/update_license_headers.py
      - id: license-headers
        name: license headers (NOTICE.yml)
        entry: python tools/check_license_headers.py
        language: python
        additional_dependencies: [pyyaml]
        pass_filenames: false
        always_run: true
        stages: [pre-commit, manual]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff-check
        name: ruff-check (fix)
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format
        name: ruff-format (write)
        stages: [pre-commit]
      - id: ruff-check
        name: ruff-check (ci)
        args: [--no-fix, --output-format=github]
        stages: [manual]
      - id: ruff-format
        name: ruff-format (ci)
        args: [--check, --diff]
        stages: [manual]
